# 原文阅读：把上传的原始 HTML 原样直出（零加工）
#
# 文件真实位置是 data/uploads/{id}.html —— 由 PHP 写入，data/ 整体禁 HTTP 访问。
# compose 里把 ./data/uploads 以**只读**方式额外挂到 /var/www/html/uploads，
# 于是 Apache 能直接吐文件，但和 data/ 的 deny 规则完全不冲突。
#
# 这样做换来两件事：
#   1) 字节级原件 —— 不经过任何 PHP 加工，不加字体垫片、不改任何标签、不注入脚本。
#      「原文阅读」打开的就是当初上传的那份 .html。
#   2) 仍然隔离 —— 响应头带 CSP sandbox，文档是不透明源：读不到站点 cookie /
#      localStorage / 同源接口，connect-src 与 form-action 全禁（挡挖矿、外传、钓鱼表单）。
#      ⚠️ 少了这个头就等于把网友上传的 HTML 放到同源下执行，绝不能省。
#
# 对应前端：index.html 的「📖 原文阅读」在 hasSource 为真时指向 /uploads/{id}.html，
# 早期没有源文件的存量故事仍回落到 api.php?route=raw（净化版 + 字体垫片）。
<Directory /var/www/html/uploads>
    Options -Indexes -ExecCGI
    AllowOverride None
    # 默认全禁，只放行 HTML
    Require all denied

    <FilesMatch "\.(html?|htm)$">
        Require all granted
        ForceType text/html
        Header always set Content-Security-Policy "sandbox allow-scripts; connect-src 'none'; form-action 'none'; base-uri 'none'"
        Header always set X-Content-Type-Options "nosniff"
    </FilesMatch>
</Directory>
