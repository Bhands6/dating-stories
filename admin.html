<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💕</text></svg>">
    <title>站长管理 - 反馈箱 | 缘分故事屋</title>
    <style>
        :root {
            --primary: #e8556d;
            --primary-light: #ff7eb3;
            --bg: #fff5f5;
            --card-bg: #ffffff;
            --text: #2d2d3a;
            --text-light: #6b6b80;
            --text-lighter: #a0a0b8;
            --border: #f0e0e5;
            --shadow: 0 4px 20px rgba(232, 85, 109, 0.08);
            --shadow-hover: 0 8px 32px rgba(232, 85, 109, 0.15);
            --gradient: linear-gradient(135deg, #ff9a76 0%, #e8556d 50%, #c23555 100%);
            --gradient-soft: linear-gradient(135deg, #fff0f3 0%, #ffe0e8 100%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg); color: var(--text); line-height: 1.7; overflow-x: hidden;
            min-height: 100vh;
        }
        .navbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000; padding: 0 24px;
            background: rgba(255, 245, 245, 0.85); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(232, 85, 109, 0.06);
        }
        .nav-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 72px; }
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-icon { width: 42px; height: 42px; background: var(--gradient); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 4px 15px rgba(232, 85, 109, 0.3); }
        .logo-text { font-size: 22px; font-weight: 700; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .logo-sub { font-size: 11px; color: var(--text-lighter); margin-top: -2px; letter-spacing: 1px; }
        .nav-right { display: flex; align-items: center; gap: 12px; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 9px 22px; background: white; border: 1.5px solid var(--border);
            border-radius: 25px; color: var(--text-light); font-size: 14px; font-weight: 600;
            text-decoration: none; transition: all 0.3s ease;
        }
        .back-btn:hover { border-color: var(--primary); color: var(--primary); }
        .page-head { padding: 130px 24px 8px; text-align: center; }
        .page-tag { display: inline-block; padding: 5px 16px; background: rgba(232, 85, 109, 0.08); border-radius: 25px; font-size: 13px; color: var(--primary); font-weight: 600; margin-bottom: 12px; letter-spacing: 1px; }
        .page-head h1 { font-size: 32px; font-weight: 800; margin-bottom: 8px; }
        .page-head p { color: var(--text-light); font-size: 14px; }
        .section { padding: 26px 24px 70px; }
        .content-card {
            max-width: 760px; margin: 0 auto; background: var(--card-bg); border-radius: 24px;
            padding: 40px 44px; box-shadow: var(--shadow); border: 1px solid var(--border);
            position: relative; overflow: hidden;
        }
        .content-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--gradient); }

        /* ===== 登录 ===== */
        .login-box { max-width: 380px; margin: 10px auto 0; text-align: center; }
        .login-box .lock { font-size: 54px; display: block; margin-bottom: 10px; }
        .login-box p { font-size: 14px; color: var(--text-light); margin-bottom: 22px; }
        .login-box input {
            width: 100%; border: 2px solid var(--border); border-radius: 10px; background: #fafafa;
            padding: 13px 16px; font-size: 15px; font-family: inherit; text-align: center;
            transition: border-color 0.3s ease; margin-bottom: 16px;
        }
        .login-box input:focus { outline: none; border-color: var(--primary-light); background: white; }
        .login-btn {
            width: 100%; padding: 13px 0; background: var(--gradient); color: white; border: none;
            border-radius: 25px; font-size: 15px; font-weight: 600; cursor: pointer;
            box-shadow: 0 4px 15px rgba(232, 85, 109, 0.3); transition: all 0.3s ease;
        }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(232, 85, 109, 0.4); }

        /* ===== 列表 ===== */
        .admin-tabs { display: flex; gap: 10px; margin-bottom: 22px; border-bottom: 1.5px solid var(--border); padding-bottom: 14px; }
        .admin-tab {
            padding: 10px 24px; border: 1.5px solid var(--border); border-radius: 25px;
            background: white; color: var(--text-light); font-size: 14px; font-weight: 600;
            cursor: pointer; transition: all 0.25s ease;
        }
        .admin-tab:hover { border-color: var(--primary-light); color: var(--primary); }
        .admin-tab.active { background: var(--gradient); color: white; border-color: transparent; box-shadow: 0 4px 15px rgba(232, 85, 109, 0.3); }
        .list-header { display: flex; align-items: center; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; margin-bottom: 20px; }
        .list-header h2 { font-size: 18px; font-weight: 700; white-space: nowrap; }
        .list-header .total { font-size: 13px; color: var(--text-lighter); white-space: nowrap; }
        .list-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }
        .mini-btn {
            padding: 8px 14px; border: 1.5px solid var(--border); border-radius: 20px;
            background: white; color: var(--text-light); font-size: 13px; font-weight: 600;
            cursor: pointer; transition: all 0.25s ease; white-space: nowrap;
        }
        .mini-btn:hover { border-color: var(--primary-light); color: var(--primary); }
        /* 「退出」在视觉上与前几个操作分开（次要 / 离开类操作） */
        .list-actions .mini-btn.logout { margin-left: 4px; }
        .list-actions .mini-btn.logout:hover { border-color: #f2c4c4; color: #d96060; }

        /* ===== 标签筛选条 ===== */
        .story-tag-filter { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
        .tag-chip {
            padding: 6px 16px; border: 1.5px solid var(--border); border-radius: 18px;
            background: white; color: var(--text-light); font-size: 12.5px; font-weight: 500;
            cursor: pointer; transition: all 0.25s ease;
        }
        .tag-chip:hover { border-color: var(--primary-light); color: var(--primary); }
        .tag-chip.active { background: var(--gradient); color: white; border-color: transparent; box-shadow: 0 3px 12px rgba(232, 85, 109, 0.25); }
        .fb-tags { margin: 6px 0 2px; display: flex; flex-wrap: wrap; gap: 6px; }
        .fb-tag {
            font-size: 11px; padding: 2px 10px; border-radius: 10px;
            background: var(--gradient-soft); color: var(--primary); font-weight: 500;
        }
        .fb-tag.empty { background: #f0f0f4; color: var(--text-lighter); }

        /* ===== 查看弹窗 ===== */
        #list-wrap .fb-item { cursor: pointer; }
        #list-wrap .fb-item:hover { border-color: var(--primary-light); }
        #list-wrap .fb-item .fb-del { cursor: pointer; }
        .view-overlay {
            position: fixed; inset: 0; background: rgba(45, 45, 58, 0.6);
            z-index: 2500; display: none; align-items: center; justify-content: center;
            padding: 20px;
        }
        .view-overlay.open { display: flex; }
        .view-modal {
            background: white; border-radius: 18px; width: 100%; max-width: 880px;
            height: 90vh; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 24px 64px rgba(45, 45, 58, 0.3);
            animation: viewIn 0.3s cubic-bezier(0.34, 1.4, 0.64, 1);
        }
        @keyframes viewIn { from { opacity: 0; transform: translateY(24px) scale(0.98); } to { opacity: 1; transform: none; } }
        .view-head {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: 14px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        .view-title { font-size: 15px; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .view-close {
            width: 34px; height: 34px; border: none; border-radius: 50%;
            background: var(--bg); color: var(--text-light); font-size: 14px;
            cursor: pointer; transition: all 0.25s ease; flex-shrink: 0;
        }
        .view-close:hover { background: var(--primary); color: white; }
        .view-frame { flex: 1; width: 100%; border: none; background: white; }
        .fb-list { display: flex; flex-direction: column; gap: 14px; }
        /* ===== 分页 ===== */
        .pager {
            display: flex; align-items: center; justify-content: center; gap: 14px;
            margin-top: 22px; font-size: 13px; color: var(--text-lighter);
        }
        .pager button {
            padding: 8px 18px; border: 1.5px solid var(--border); border-radius: 20px;
            background: white; color: var(--text-light); font-size: 13px; font-weight: 600;
            cursor: pointer; transition: all 0.25s ease;
        }
        .pager button:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
        .pager button:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ===== 工具栏：搜索 + 排序 ===== */
        .admin-toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        .admin-toolbar input[type="search"] {
            flex: 1; min-width: 200px; padding: 9px 16px;
            border: 1.5px solid var(--border); border-radius: 20px;
            font-size: 13px; font-family: inherit; background: white; color: var(--text);
        }
        .admin-toolbar input[type="search"]:focus { outline: none; border-color: var(--primary-light); }
        .admin-toolbar select {
            padding: 9px 14px; border: 1.5px solid var(--border); border-radius: 20px;
            font-size: 13px; font-family: inherit; background: white; color: var(--text-light); cursor: pointer;
        }
        .admin-toolbar select:focus { outline: none; border-color: var(--primary-light); }

        /* ===== 故事卡片的操作按钮 ===== */
        .fb-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .fb-edit, .fb-cm, .fb-pin {
            margin-top: 10px; padding: 5px 14px; border: 1px solid var(--border); border-radius: 15px;
            background: white; color: var(--text-light); font-size: 12px; cursor: pointer;
            transition: all 0.25s ease; font-family: inherit;
        }
    .fb-edit:hover, .fb-cm:hover, .fb-pin:hover { background: #fff5f7; border-color: var(--primary-light); color: var(--primary); }
    .fb-pin.on { background: var(--gradient); color: white; border-color: transparent; }
    .fb-pinned-badge {
        font-size: 11px; color: var(--primary); background: #fff0f3;
        padding: 2px 8px; border-radius: 10px; white-space: nowrap; font-weight: 600;
    }
    #list-wrap .fb-item .fb-pin { cursor: pointer; }
        .fb-cm.on { background: var(--gradient); color: white; border-color: transparent; }

        /* ===== 故事卡片内联评论面板 ===== */
        .cm-panel { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border); cursor: default; }
        .cm-panel-head { font-size: 12px; color: var(--text-lighter); margin-bottom: 6px; }
        .cm-empty { font-size: 13px; color: var(--text-lighter); padding: 8px 0; }
        .cm-line { display: flex; gap: 10px; padding: 9px 0; align-items: flex-start; }
        .cm-line.is-reply { margin-left: 32px; border-left: 2px solid var(--border); padding-left: 12px; }
        .cm-line-ava {
            width: 28px; height: 28px; border-radius: 50%; background: var(--gradient-soft);
            display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0;
        }
        .cm-line-body { flex: 1; min-width: 0; }
        .cm-line-meta { font-size: 12px; color: var(--text-lighter); margin-bottom: 3px; }
        .cm-line-meta b { color: var(--text-light); }
        .cm-line-to { color: var(--primary); margin-left: 4px; }
        .cm-line-time { margin-left: 6px; }
        .cm-line-text { font-size: 13px; color: var(--text); line-height: 1.7; word-break: break-word; white-space: pre-wrap; }
        .cm-line-del {
            border: none; background: transparent; cursor: pointer; font-size: 14px;
            opacity: 0.45; padding: 2px 6px; border-radius: 6px; flex-shrink: 0; transition: all 0.2s ease;
        }
        .cm-line-del:hover { opacity: 1; background: #fef0f0; }

        /* ===== 编辑 / 改密码弹窗 ===== */
        .edit-overlay {
            position: fixed; inset: 0; background: rgba(45, 45, 58, 0.55);
            z-index: 3000; display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .edit-overlay.open { display: flex; }
        .edit-modal {
            background: white; border-radius: 18px; width: 100%; max-width: 720px;
            max-height: 90vh; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 24px 64px rgba(45, 45, 58, 0.3);
        }
        .edit-modal.small { max-width: 440px; }
        .edit-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 20px; border-bottom: 1px solid var(--border);
            font-size: 15px; font-weight: 700; flex-shrink: 0;
        }
        .edit-body { padding: 18px 20px; overflow-y: auto; flex: 1 1 auto; min-height: 0; }
        .edit-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-light); margin: 0 0 8px; }
        .edit-input, .edit-textarea {
            width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 12px;
            font-size: 14px; font-family: inherit; color: var(--text); background: white;
            margin-bottom: 18px; box-sizing: border-box;
        }
        .edit-input:focus, .edit-textarea:focus { outline: none; border-color: var(--primary-light); }
        .edit-textarea { min-height: 300px; line-height: 1.7; resize: vertical; }
        .edit-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
        .edit-tag {
            padding: 6px 14px; border: 1.5px solid var(--border); border-radius: 16px;
            background: white; color: var(--text-light); font-size: 13px; cursor: pointer;
            transition: all 0.2s ease; font-family: inherit;
        }
        .edit-tag.on { background: var(--gradient); color: white; border-color: transparent; }
        .edit-hint { font-size: 12px; color: var(--text-lighter); line-height: 1.7; margin: 0; }
        .edit-foot {
            display: flex; justify-content: flex-end; gap: 10px;
            padding: 14px 20px; border-top: 1px solid var(--border); flex-shrink: 0;
        }
        .mini-btn.primary { background: var(--gradient); color: white; border-color: transparent; }
        .mini-btn.primary:hover { color: white; opacity: 0.9; }
        .mini-btn.danger { border-color: #f2c4c4; color: #d96060; }
        .mini-btn.danger:hover { background: #fef0f0; border-color: #d96060; color: #d96060; }

        /* ===== 导出选项卡片 ===== */
        .export-choices { display: flex; flex-direction: column; gap: 10px; padding: 4px 0 8px; }
        .export-choice {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 16px; border: 2px solid var(--border); border-radius: 14px;
            background: white; cursor: pointer; transition: all 0.2s ease;
            font-family: inherit; text-align: left; width: 100%; color: var(--text);
        }
        .export-choice:hover { border-color: var(--primary-light); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(232, 85, 109, 0.12); }
        .export-choice:active { transform: translateY(0); }
        .export-choice .icon { font-size: 22px; flex-shrink: 0; }
        .export-choice .stack { flex: 1; min-width: 0; }
        .export-choice .name { display: block; font-weight: 700; font-size: 14px; }
        .export-choice .desc { display: block; font-size: 12px; color: var(--text-lighter); margin-top: 2px; line-height: 1.5; }
        .mini-btn:disabled { opacity: 0.45; cursor: not-allowed; }

        /* ===== 数据概览 ===== */
        .ov-panel {
            display: flex; flex-wrap: wrap; gap: 10px;
            padding: 14px 16px; margin-bottom: 16px;
            background: #fdfbfc; border: 1.5px solid var(--border); border-radius: 14px;
        }
        .ov-item { flex: 1; min-width: 76px; text-align: center; }
        .ov-item b { display: block; font-size: 18px; font-weight: 800; color: var(--text); line-height: 1.3; }
        .ov-item span { font-size: 11px; color: var(--text-lighter); }
        .ov-item.ov-today b { color: var(--primary); }

        /* ===== 批量操作栏 ===== */
        .batch-bar {
            display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
            padding: 10px 14px; margin-bottom: 14px;
            background: #fff5f7; border: 1.5px dashed #f2c4c4; border-radius: 12px;
        }
        .batch-all { font-size: 13px; color: var(--text-light); cursor: pointer; user-select: none; }
        .batch-count { font-size: 12px; color: var(--text-lighter); margin-right: auto; }
        .fb-check {
            display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
            color: var(--text-light); cursor: pointer; user-select: none; margin-top: 10px;
        }

        /* ===== 反馈未读 ===== */
        .fb-item.unread { border-color: var(--primary-light); background: #fffafb; }
        .fb-unread-dot {
            display: inline-block; width: 7px; height: 7px; border-radius: 50%;
            background: var(--primary); margin-right: 6px; vertical-align: middle;
        }
        .fb-item {
            border: 1.5px solid var(--border); border-radius: 14px; padding: 18px 20px;
            transition: all 0.25s ease; background: #fdfbfc;
        }
        .fb-item:hover { border-color: var(--primary-light); box-shadow: var(--shadow); }
        .fb-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
        .fb-ava {
            width: 32px; height: 32px; border-radius: 50%; background: var(--gradient-soft);
            border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center;
            font-size: 14px; flex-shrink: 0;
        }
        .fb-name { font-size: 14px; font-weight: 700; }
        .fb-time { font-size: 12px; color: var(--text-lighter); }
        .fb-contact { font-size: 12px; color: var(--primary); background: rgba(232, 85, 109, 0.06); padding: 3px 10px; border-radius: 12px; margin-left: auto; }
        .fb-contact.empty { color: var(--text-lighter); background: transparent; }
    .fb-contact .fb-real { color: #b8791f; font-weight: 600; }
        .fb-content { font-size: 14px; color: var(--text-light); line-height: 1.9; word-break: break-word; white-space: pre-wrap; }
        .fb-del {
            margin-top: 10px; padding: 5px 14px; border: 1px solid #f2c4c4; border-radius: 15px;
            background: white; color: #d96060; font-size: 12px; cursor: pointer; transition: all 0.25s ease;
        }
        .fb-del:hover { background: #fef0f0; border-color: #d96060; }
        .empty-tip { text-align: center; padding: 40px 0; color: var(--text-lighter); font-size: 14px; }
        .loading-tip { text-align: center; padding: 30px 0; color: var(--text-lighter); font-size: 14px; }
        .toast-container { position: fixed; top: 90px; right: 24px; z-index: 3000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast {
            padding: 12px 20px; border-radius: 12px; background: white; box-shadow: var(--shadow-hover);
            border-left: 3px solid var(--primary); font-size: 14px; color: var(--text);
            animation: toastIn 0.35s cubic-bezier(0.34, 1.4, 0.64, 1); max-width: 320px;
        }
        .toast.error { border-left-color: #d93025; }
        .toast.out { opacity: 0; transform: translateX(30px); transition: all 0.35s ease; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
        .back-top {
            position: fixed; right: 28px; bottom: 28px; width: 48px; height: 48px;
            border-radius: 50%; background: var(--gradient); color: white; border: none;
            cursor: pointer; font-size: 20px; font-weight: 700;
            box-shadow: 0 6px 20px rgba(232, 85, 109, 0.35);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transform: translateY(16px);
            transition: all 0.3s ease; z-index: 1500;
        }
        .back-top.show { opacity: 1; visibility: visible; transform: translateY(0); }
        .back-top:hover { transform: translateY(-4px); box-shadow: 0 10px 28px rgba(232, 85, 109, 0.45); }
        @media (max-width: 768px) {
            .content-card { padding: 26px 20px; }
            .toast-container { right: 12px; left: 12px; }
            .toast { max-width: none; }
            .back-top { right: 16px; bottom: 16px; }
        }

        /* 手机：标题与操作按钮分两行、统一左对齐（靠右会让换行后的按钮看着散） */
        @media (max-width: 560px) {
            .list-header { flex-direction: column; align-items: stretch; gap: 12px; }
            .list-actions { justify-content: flex-start; margin-left: 0; }
            .ov-panel { gap: 8px; padding: 12px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-inner">
            <a class="logo" href="index.html">
                <div class="logo-icon">💕</div>
                <div>
                    <div class="logo-text">缘分故事屋</div>
                    <div class="logo-sub">DATING STORIES</div>
                </div>
            </a>
            <div class="nav-right">
                <a class="back-btn" href="index.html">← 返回站点</a>
            </div>
        </div>
    </nav>

    <div class="page-head">
        <div class="page-tag">🔐 ADMIN</div>
        <h1>网友反馈箱</h1>
        <p>只有站长能打开这里 · 请妥善保管管理密码</p>
    </div>

    <div class="section">
        <div class="content-card">
            <!-- 登录 -->
            <div class="login-box" id="login-box">
                <span class="lock">🔐</span>
                <p>输入管理密码，查看网友发来的反馈与建议</p>
                <input type="password" id="admin-key" placeholder="管理密码" autocomplete="off">

    <div class="toast-container" id="toast-container"></div>

    <!-- 查看故事弹窗 -->
    <div class="view-overlay" id="view-overlay">

    <!-- 编辑故事弹窗 -->
    <div class="edit-overlay" id="edit-overlay">
        <div class="edit-modal">

                <span>✏️ 编辑故事</span>

    <!-- 导出数据弹窗（让用户显式选 stories / feedback，避免 confirm 的「确定/取消」语义错乱） -->
    <div class="edit-overlay" id="export-overlay">
        <div class="edit-modal small">
            <div class="edit-head">
                <span>⬇️ 导出数据</span>
                <button class="view-close" id="export-close" title="关闭">✕</button>
            </div>
            <div class="edit-body">
                <p class="edit-hint" style="margin-bottom: 14px;">选要导出的内容，浏览器会立即开始下载 JSON：</p>
                <div class="export-choices">
                    <button class="export-choice" id="export-stories-btn" data-what="stories">
                        <span class="icon">📚</span>
                        <span class="stack">

                            <span class="desc">stories.json · 含故事、评论、点赞、浏览、编辑/删除凭证</span>
                        </span>

                    <button class="export-choice" id="export-feedback-btn" data-what="feedback">
                        <span class="icon">📮</span>
                        <span class="stack">
                            <span class="name">反馈数据</span>

    <!-- Back to Top -->
    <button class="back-top" id="back-top" title="返回顶部" aria-label="返回顶部">↑</button>

    <script>
    'use strict';
    const KEY_STORE = 'yf_admin_key';
    const $ = s => document.querySelector(s);
    const $$ = s => Array.from(document.querySelectorAll(s));

    function toast(msg, type) {
        const box = document.createElement('div');
        box.className = 'toast' + (type === 'error' ? ' error' : '');
        box.textContent = msg;
        $('#toast-container').appendChild(box);
        setTimeout(() => {
            box.classList.add('out');
            setTimeout(() => box.remove(), 400);
        }, 2600);
    }

    async function api(body, route) {
        // 请求超时保护：10 秒未响应则报错，避免列表永远卡在「加载中」
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 10000);
        let r;
        try {
            r = await fetch('api.php?route=' + (route || 'admin_feedback'), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
                signal: ctrl.signal
            });
        } catch (e) {
            clearTimeout(timer);
            throw new Error(e.name === 'AbortError' ? '请求超时，请稍后重试' : '网络请求失败，请检查服务是否运行');
        }
        clearTimeout(timer);
        const data = await r.json();
        if (!data.ok) throw new Error(data.error || '请求失败');
        return data;
    }

    let currentTab = 'fb'; // 'fb' = 反馈箱 | 'story' = 故事管理
    let storyTag = 'all';  // 故事管理的标签筛选

    // 分页状态：两个列表各自独立（切 tab 不互相影响页码）
    const PAGER = {
        fb:    { page: 1, pageSize: 20, total: 0 },
        story: { page: 1, pageSize: 20, total: 0 },
    };

    /** 渲染分页条；只有一页时整条隐藏 */
    function renderPager(which) {
        const st = PAGER[which];
        const el = $('#' + which + '-pager');
        if (!el) return;
        const pages = Math.max(1, Math.ceil(st.total / st.pageSize));
        if (st.total <= st.pageSize) { el.innerHTML = ''; el.style.display = 'none'; return; }
        el.style.display = 'flex';
        el.innerHTML =
            `<button data-go="prev"${st.page <= 1 ? ' disabled' : ''}>← 上一页</button>` +
            `<span>第 ${st.page} / ${pages} 页</span>` +
            `<button data-go="next"${st.page >= pages ? ' disabled' : ''}>下一页 →</button>`;
        el.querySelectorAll('button[data-go]').forEach(btn => {
            btn.addEventListener('click', () => {
                const next = btn.dataset.go === 'prev' ? st.page - 1 : st.page + 1;
                if (next < 1 || next > pages || next === st.page) return;
                st.page = next;
                loadList();
            });
        });
    }

    const TAG_NAMES = {
        sweet: '甜蜜脱单', funny: '搞笑经历', touching: '感人故事', complain: '心酸吐槽',
        daily: '日常记录', yidi: '异地相亲', chujian: '初次见面', liaotian: '聊天记录',
        jiaolv: '年龄焦虑', cuihun: '父母催婚', jianjia: '见家长', yilian: '异地恋', shanhun: '闪婚'
    };

    function renderStoryTagFilter() {
        const wrap = $('#story-tag-filter');
        const tags = [['all', '🏷️ 全部'], ...Object.entries(TAG_NAMES).map(([v, label]) => [v, label])];
        wrap.innerHTML = tags.map(([v, label]) =>
            `<button class="tag-chip${storyTag === v ? ' active' : ''}" data-tag="${v}">${label}</button>`).join('');
        wrap.querySelectorAll('.tag-chip').forEach(btn => {
            btn.addEventListener('click', () => {
                if (storyTag === btn.dataset.tag) return;
                storyTag = btn.dataset.tag;
                PAGER.story.page = 1;   // 换分类回到第一页
                renderStoryTagFilter();
                loadList();
            });
        });
    }

    function fmtTime(ts) {
        const d = new Date(Number(ts) * 1000);
        const pad = n => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    /** 大数字简写：25600 → 2.6w */
    function fmtNum(n) {
        n = Number(n) || 0;
        if (n >= 10000) { return (n / 10000).toFixed(1).replace(/\.0$/, '') + 'w'; }
        return String(n);
    }

    function renderFeedback(items, total) {
        const n = (total === undefined ? items.length : total);
        $('#list-title').innerHTML = '📬 收到的反馈 <span class="total" id="list-total">· 共 ' + n + ' 条</span>';
        const list = $('#fb-list');
        if (!items.length) {
            list.innerHTML = '<div class="empty-tip">📭 暂时还没有反馈，去分享给朋友们吧～</div>';
            return;
        }
        list.innerHTML = items.map(it => `
            <div class="fb-item${it.read ? '' : ' unread'}">
                <div class="fb-head">
                    ${it.read ? '' : '<span class="fb-unread-dot"></span>'}
                    <div class="fb-ava">${(it.nickname || '匿').charAt(0)}</div>
                    <span class="fb-name">${it.nickname}</span>
                    <span class="fb-time">${fmtTime(it.createdAt)}</span>
                    ${it.contact
                        ? `<span class="fb-contact">联系方式：${it.contact}</span>`
                        : `<span class="fb-contact empty">未留联系方式</span>`}
                </div>
                <div class="fb-content"></div>
                <button class="fb-del" data-id="${it.id}">🗑 删除</button>
            </div>`).join('');
        // 内容用 textContent 填充，避免 XSS
        list.querySelectorAll('.fb-item').forEach((el, i) => {
            el.querySelector('.fb-content').textContent = items[i].content;
        });
        list.querySelectorAll('.fb-del').forEach(btn => {
            btn.addEventListener('click', async () => {
                if (!confirm('确定删除这条反馈吗？删除后无法恢复。')) return;
                try {
                    await api({ key: getKey(), op: 'delete', id: Number(btn.dataset.id) });
                    toast('🗑 已删除');
                    loadList();
                    loadOverview();
                } catch (e) {
                    toast(e.message, 'error');
                }
            });
        });
    }

    /* ===== 查看故事弹窗 ===== */
    function openView(id, title) {
        $('#view-title').textContent = title || '故事预览';
        $('#view-frame').src = 'api.php?route=raw&id=' + id + '&t=' + Date.now();
        $('#view-overlay').classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeView() {
        $('#view-overlay').classList.remove('open');
        $('#view-frame').src = 'about:blank';
        document.body.style.overflow = '';
    }

    $('#view-close').addEventListener('click', closeView);
    $('#view-overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeView(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeView(); });

    function renderStories(items, total) {
        const n = (total === undefined ? items.length : total);
        $('#list-title').innerHTML = '📚 全部故事 <span class="total" id="list-total">· 共 ' + n + ' 篇' + (storyTag !== 'all' ? '（' + (TAG_NAMES[storyTag] || storyTag) + '）' : '') + '</span>';
        const list = $('#story-list');
        if (!items.length) {
            list.innerHTML = '<div class="empty-tip">📭 该分类下暂时没有故事</div>';
            return;
        }
        list.innerHTML = items.map(it => {
            const tagBadges = (it.tags || []).map(t => `<span class="fb-tag">${TAG_NAMES[t] || t}</span>`).join('')
                || '<span class="fb-tag empty">无标签</span>';
            return `
            <div class="fb-item" data-id="${it.id}" data-title="${it.title.replace(/"/g, '&quot;')}">
                <div class="fb-head">
                    <div class="fb-ava">${(it.title || '故').charAt(0)}</div>
                    <span class="fb-name">${it.title}</span>
                    ${it.pinned ? '<span class="fb-pinned-badge">📌 置顶</span>' : ''}
                    <span class="fb-time">${fmtTime(it.createdAt)}</span>
                    <span class="fb-contact">👁️ ${it.views} · ❤️ ${it.likes} · 💬 ${it.commentsCount}${Number(it.realCount) > 0 ? ` · <span class="fb-real" title="真实鉴定数">✔ ${fmtNum(it.realCount)}</span>` : ''}</span>
                </div>
                <div class="fb-tags">${tagBadges}</div>
                <div class="fb-content">✍️ ${it.author}</div>
                <div class="fb-actions">
                    <label class="fb-check"><input type="checkbox" class="story-check" data-id="${it.id}"></label>
                    <button class="fb-pin${it.pinned ? ' on' : ''}" data-id="${it.id}">📌 ${it.pinned ? '已置顶' : '置顶'}</button>
                    <button class="fb-edit" data-id="${it.id}">✏️ 编辑</button>
                    <button class="fb-cm" data-id="${it.id}">💬 评论${it.commentsCount ? ' (' + it.commentsCount + ')' : ''}</button>
                    <button class="fb-del" data-id="${it.id}">🗑 删除故事</button>
                </div>
                <div class="cm-panel" id="cm-panel-${it.id}" style="display:none;"></div>
            </div>`;
        }).join('');
        // 点击卡片 → 查看故事（编辑 / 删除按钮除外）
        list.querySelectorAll('.fb-item').forEach(el => {
            el.addEventListener('click', e => {
            if (e.target.closest('.fb-del') || e.target.closest('.fb-edit') || e.target.closest('.fb-pin')
                    || e.target.closest('.fb-cm') || e.target.closest('.cm-panel')) return;
                openView(Number(el.dataset.id), el.dataset.title);
            });
        });
        list.querySelectorAll('.story-check').forEach(b => {
            b.addEventListener('change', e => { e.stopPropagation(); updateBatchBar(); });
        });
        // 置顶/取消置顶：独立开关，不必打开编辑弹窗
        list.querySelectorAll('.fb-pin').forEach(btn => {
            btn.addEventListener('click', async e => {
                e.stopPropagation();
                const id = Number(btn.dataset.id);
                const willPin = !btn.classList.contains('on');
                btn.disabled = true;
                try {
                    const d = await api({ key: getKey(), op: 'pin', id, pinned: willPin }, 'admin_stories');
                    toast(d.message || (willPin ? '已置顶' : '已取消置顶'));
                    loadList();
                    loadOverview();
                } catch (err) {
                    toast('操作失败：' + err.message, 'error');
                    btn.disabled = false;
                }
            });
        });
        list.querySelectorAll('.fb-edit').forEach(btn => {
            btn.addEventListener('click', e => {
                e.stopPropagation();
                openEdit(Number(btn.dataset.id));
            });
        });
        list.querySelectorAll('.fb-cm').forEach(btn => {
            btn.addEventListener('click', e => {
                e.stopPropagation();
                toggleStoryComments(Number(btn.dataset.id), btn);
            });
        });
        list.querySelectorAll('.fb-del').forEach(btn => {
            btn.addEventListener('click', async e => {
                e.stopPropagation();
                if (!confirm('确定删除这篇故事吗？其评论也会一并删除，且无法恢复。')) return;
                try {
                    await api({ key: getKey(), op: 'delete', id: Number(btn.dataset.id) }, 'admin_stories');
                    toast('🗑 故事已删除');
                    loadList();
                    loadOverview();   // 删除会改动总赞/总浏览/评论数，概览跟着刷
                } catch (err) {
                    toast(err.message, 'error');
                }
            });
        });
    }

    /* ==================== 数据概览 ==================== */
    async function loadOverview() {
        try {
            const d = await api({ key: getKey() }, 'admin_stats');
            const s = d.stats || {};
            const set = (id, v) => { const el = $(id); if (el) el.textContent = v; };
            set('#ov-stories', s.stories ?? '–');
            set('#ov-likes', fmtNum(s.likes || 0));
            set('#ov-views', fmtNum(s.views || 0));
            set('#ov-comments', fmtNum(s.comments || 0));
            set('#ov-today', (s.todayStories || 0) + (s.todayComments || 0) + (s.todayFeedback || 0));
            set('#ov-fb', s.feedbackUnread || 0);
            const fbItem = $('#ov-fb-item');
            if (fbItem) fbItem.style.opacity = s.feedbackUnread ? '1' : '0.45';
        } catch (e) { /* 概览加载失败不打扰用户 */ }
    }

    /* ==================== 批量删除 ==================== */
    function updateBatchBar() {
        const checked = $$('#story-list .story-check:checked');
        const n = checked.length;
        const bar = $('#batch-bar');
        if (!bar) return;
        const all = $$('#story-list .story-check');
        bar.style.display = (currentTab === 'story' && all.length) ? 'flex' : 'none';
        const cnt = $('#batch-count');
        if (cnt) cnt.textContent = '已选 ' + n + ' 篇';
        const allBox = $('#check-all');
        if (allBox) {
            allBox.checked = all.length > 0 && n === all.length;
            allBox.indeterminate = n > 0 && n < all.length;
        }
        const delBtn = $('#batch-del');
        if (delBtn) delBtn.disabled = n === 0;
    }

    async function batchDelete() {
        const ids = $$('#story-list .story-check:checked').map(el => Number(el.dataset.id));
        if (!ids.length) return;
        if (!confirm('确定删除选中的 ' + ids.length + ' 篇故事吗？\n它们下面的评论也会一起删除，且无法恢复。')) return;
        try {
            await api({ key: getKey(), op: 'delete', ids }, 'admin_stories');
            toast('🗑 已删除 ' + ids.length + ' 篇故事');
            loadList();
            loadOverview();
        } catch (e) {
            toast(e.message, 'error');
        }
    }

    /* ==================== 反馈已读 ==================== */
    async function markAllRead() {
        try {
            await api({ key: getKey(), op: 'read' }, 'admin_feedback');
            toast('✅ 已全部标为已读');
            loadList();
            loadOverview();
        } catch (e) {
            toast(e.message, 'error');
        }
    }

    /* ==================== 故事卡片的内联评论面板 ==================== */

    /** 展开 / 收起某篇故事的评论面板 */
    async function toggleStoryComments(storyId, btn) {
        const panel = document.getElementById('cm-panel-' + storyId);
        if (!panel) return;
        if (panel.style.display !== 'none') {      // 已展开 → 收起
            panel.style.display = 'none';
            btn.classList.remove('on');
            return;
        }
        panel.style.display = '';
        btn.classList.add('on');
        await loadStoryComments(storyId);
    }

    /** 拉取并渲染某篇故事的评论（一级 + 缩进回复，各带删除按钮） */
    async function loadStoryComments(storyId) {
        const panel = document.getElementById('cm-panel-' + storyId);
        if (!panel) return;
        panel.innerHTML = '<div class="loading-tip">加载中…</div>';
        try {
            const d = await api({ key: getKey(), op: 'list', storyId: storyId, pageSize: 100 }, 'admin_comments');
            const items = d.items || [];
            if (!items.length) {
                panel.innerHTML = '<div class="cm-empty">还没有评论</div>';
                return;
            }
            panel.innerHTML =
                `<div class="cm-panel-head">共 ${items.length} 条</div>` +
                items.map(it => `
                    <div class="cm-line${it.isReply ? ' is-reply' : ''}">
                        <div class="cm-line-ava">${(it.nickname || '匿').charAt(0)}</div>
                        <div class="cm-line-body">
                            <div class="cm-line-meta">
                                <b>${it.nickname}</b>
                                ${it.isReply ? `<span class="cm-line-to">↩ ${it.replyTo || '某人'}</span>` : ''}
                                <span class="cm-line-time">${fmtTime(it.createdAt)}</span>
                            </div>
                            <div class="cm-line-text"></div>
                        </div>
                        <button class="cm-line-del" data-story="${storyId}" data-cid="${it.id}" title="删除这条${it.isReply ? '回复' : '评论'}">🗑</button>
                    </div>`).join('');

            // 内容用 textContent 填充，避免 XSS
            panel.querySelectorAll('.cm-line').forEach((el, i) => {
                el.querySelector('.cm-line-text').textContent = items[i].content;
            });
            panel.querySelectorAll('.cm-line-del').forEach(b => {
                b.addEventListener('click', async e => {
                    e.stopPropagation();
                    if (!confirm('确定删除这条评论吗？删除后无法恢复。\n如果它是一级评论，它下面的所有回复也会一起删除。')) return;
                    try {
                        await api({ key: getKey(), op: 'delete', storyId: Number(b.dataset.story), commentId: b.dataset.cid }, 'admin_comments');
                        toast('🗑 评论已删除');
                        await loadList();                    // 刷新列表（评论数变了），卡片会重建
                        loadOverview();                      // 评论数变了，概览跟着刷
                        const np = document.getElementById('cm-panel-' + storyId);
                        if (np) {                            // 重建后自动重新展开
                            np.style.display = '';
                            const nb = document.querySelector('.fb-cm[data-id="' + storyId + '"]');
                            if (nb) nb.classList.add('on');
                            await loadStoryComments(storyId);
                        }
                    } catch (err) {
                        toast(err.message, 'error');
                    }
                });
            });
        } catch (e) {
            panel.innerHTML = '<div class="cm-empty">😢 ' + e.message + '</div>';
        }
    }

    /* ==================== 编辑故事 ==================== */
    let editingId = null;
    let editingTags = [];

    async function openEdit(id) {
        editingId = id;
        try {
            // 注意：本页的 api() 只发 POST，而 story 是 GET 接口，这里直接 fetch
            const r = await fetch('api.php?route=story&id=' + encodeURIComponent(id) + '&count=0');
            const d = await r.json();
            if (!d.ok) throw new Error(d.error || '加载失败');
            const s = d.story;
            editingTags = (s.tags || []).slice();
            $('#edit-title').value = s.title || '';
            $('#edit-content').value = s.content || '';
            $('#edit-likes').value = Number(s.likes || 0);
            $('#edit-views').value = Number(s.views || 0);
        $('#edit-real').value = Number(s.realCount || 0);
            renderEditTags();
            $('#edit-overlay').classList.add('open');
        } catch (e) {
            toast('打开编辑失败：' + e.message, 'error');
        }
    }

    function renderEditTags() {
        const wrap = $('#edit-tags');
        wrap.innerHTML = Object.entries(TAG_NAMES).map(([v, label]) =>
            `<button class="edit-tag${editingTags.includes(v) ? ' on' : ''}" data-tag="${v}">${label}</button>`).join('');
        wrap.querySelectorAll('.edit-tag').forEach(btn => {
            btn.addEventListener('click', () => {
                const t = btn.dataset.tag;
                if (editingTags.includes(t)) {
                    editingTags = editingTags.filter(x => x !== t);
                } else {
                    if (editingTags.length >= 4) { toast('最多选 4 个标签', 'error'); return; }
                    editingTags.push(t);
                }
                renderEditTags();
            });
        });
    }

    function closeEdit() {
        $('#edit-overlay').classList.remove('open');
        editingId = null;
    }

    async function saveEdit() {
        if (editingId === null) return;
        const title = $('#edit-title').value.trim();
        const content = $('#edit-content').value.trim();
        if (!title) { toast('标题不能为空', 'error'); return; }
        if (!content) { toast('正文不能为空', 'error'); return; }
        const likes = $('#edit-likes').value;
        const views = $('#edit-views').value;
        const real = $('#edit-real').value;
        const btn = $('#edit-save');
        btn.disabled = true;
        try {
            await api({ key: getKey(), op: 'update', id: editingId, title, content, tags: editingTags, likes, views, realCount: real }, 'admin_stories');
            toast('💾 已保存');
            closeEdit();
            loadList();
            loadOverview();      // 可能改了点赞/浏览数，概览跟着刷
        } catch (e) {
            toast(e.message, 'error');
        }
        btn.disabled = false;
    }

    /* ==================== 导出数据 ==================== */
    async function exportData(what) {
        try {
            const r = await fetch('api.php?route=admin_export', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: getKey(), what })
            });
            if (!r.ok) {
                let msg = '导出失败';
                try { msg = (await r.json()).error || msg; } catch (e) { /* 非 JSON */ }
                throw new Error(msg);
            }
            const blob = await r.blob();
            const cd = r.headers.get('Content-Disposition') || '';
            const m = cd.match(/filename="?([^"]+)"?/);
            const name = m ? m[1] : (what === 'feedback' ? 'feedback.json' : 'stories.json');
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = name;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            toast('⬇️ 已开始下载 ' + name);
        } catch (e) {
            toast('导出失败：' + e.message, 'error');
        }
    }

    /* ==================== 修改密码 ==================== */
    async function savePassword() {
        const newKey = $('#pwd-new').value.trim();
        if (newKey.length < 8) { toast('新密码至少 8 位', 'error'); return; }
        const btn = $('#pwd-save');
        btn.disabled = true;
        try {
            await api({ key: getKey(), newKey }, 'admin_change_key');
            setKey(newKey);              // 本机浏览器同步记住新密码
            toast('🔑 密码已更新');
            $('#pwd-overlay').classList.remove('open');
            $('#pwd-new').value = '';
        } catch (e) {
            toast(e.message, 'error');
        }
        btn.disabled = false;
    }

    const ROUTE_OF = { fb: 'admin_feedback', story: 'admin_stories' };

    async function loadList() {
        const containers = { fb: $('#fb-list'), story: $('#story-list') };
        const which = currentTab;
        const st = PAGER[which];
        containers[which].innerHTML = '<div class="loading-tip">加载中…</div>';
        try {
            const payload = { key: getKey(), op: 'list', page: st.page, pageSize: st.pageSize };
            if (which === 'story') {
                payload.tag = storyTag;
                payload.sort = $('#sort-select').value || 'new';
                payload.q = $('#search-input').value.trim();
            }
            const d = await api(payload, ROUTE_OF[which]);
            const items = d.items || [];
            st.total = Number(d.total || 0);
            // 删掉当前页最后一条后本页会变空 → 自动回退一页再取
            if (!items.length && st.page > 1) { st.page -= 1; return loadList(); }
            if (which === 'fb') renderFeedback(items, st.total);
            else renderStories(items, st.total);
            renderPager(which);
        } catch (e) {
            if (e.message.includes('密码')) { clearKey(); showLogin(); }
            if (containers[which]) containers[which].innerHTML = '<div class="empty-tip">😢 ' + e.message + '</div>';
        }
    }

    function switchTab(tab) {
        if (currentTab === tab) return;
        currentTab = tab;
        $$('.admin-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
        $('#fb-list').style.display = tab === 'fb' ? '' : 'none';
        $('#story-list').style.display = tab === 'story' ? '' : 'none';
        $('#story-tag-filter').style.display = tab === 'story' ? 'flex' : 'none';
        // 搜索 + 排序只对「故事管理」有意义
        $('#admin-toolbar').style.display = tab === 'story' ? 'flex' : 'none';
        // 换 tab 时清空搜索词、排序回默认，避免条件串过来
        $('#search-input').value = '';
        $('#sort-select').value = 'new';
        // 批量栏只对「故事管理」；「全部已读」只对「反馈箱」
        if (tab === 'story') updateBatchBar();
        $('#batch-bar').style.display = tab === 'story' ? 'flex' : 'none';
        $('#readall-btn').style.display = tab === 'fb' ? '' : 'none';
        // 分页条先全部收起，loadList() 里按当前列表重新渲染
        $('#fb-pager').style.display = 'none';
        $('#story-pager').style.display = 'none';
        loadList();
    }

    $$('.admin-tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));

    // 批量选择 / 删除
    $('#check-all').addEventListener('change', e => {
        $$('#story-list .story-check').forEach(b => { b.checked = e.target.checked; });
        updateBatchBar();
    });
    $('#batch-del').addEventListener('click', batchDelete);

    // 反馈全部标为已读
    $('#readall-btn').addEventListener('click', markAllRead);

    // 搜索（防抖 350ms）+ 排序
    let searchTimer = null;
    $('#search-input').addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            const st = PAGER[currentTab];
            if (st) st.page = 1;
            loadList();
        }, 350);
    });
    $('#sort-select').addEventListener('change', () => {
        PAGER.story.page = 1;
        loadList();
    });

    // 导出数据：弹窗让用户显式选 stories / feedback（取消 = 关闭，不触发导出）
    const openExport = () => $('#export-overlay').classList.add('open');
    const closeExport = () => $('#export-overlay').classList.remove('open');
    $('#export-btn').addEventListener('click', openExport);
    $('#export-close').addEventListener('click', closeExport);
    $('#export-cancel').addEventListener('click', closeExport);
    $('#export-overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeExport(); });
    $$('#export-overlay .export-choice').forEach(b => {
        b.addEventListener('click', () => { const what = b.dataset.what; closeExport(); exportData(what); });
    });

    // 修改密码弹窗
    $('#passwd-btn').addEventListener('click', () => {
        $('#pwd-new').value = '';
        $('#pwd-overlay').classList.add('open');
        setTimeout(() => $('#pwd-new').focus(), 50);
    });
    $('#pwd-cancel').addEventListener('click', () => $('#pwd-overlay').classList.remove('open'));
    $('#pwd-close').addEventListener('click', () => $('#pwd-overlay').classList.remove('open'));
    $('#pwd-overlay').addEventListener('click', e => { if (e.target === e.currentTarget) $('#pwd-overlay').classList.remove('open'); });
    $('#pwd-save').addEventListener('click', savePassword);

    // 编辑故事弹窗
    $('#edit-cancel').addEventListener('click', closeEdit);
    $('#edit-close').addEventListener('click', closeEdit);
    $('#edit-overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeEdit(); });
    $('#edit-save').addEventListener('click', saveEdit);

    document.addEventListener('keydown', e => {
        if (e.key !== 'Escape') return;
        if ($('#edit-overlay').classList.contains('open')) closeEdit();
        if ($('#pwd-overlay').classList.contains('open')) $('#pwd-overlay').classList.remove('open');
        if ($('#export-overlay').classList.contains('open')) $('#export-overlay').classList.remove('open');
    });

    function getKey() { return localStorage.getItem(KEY_STORE) || ''; }
    function setKey(k) { localStorage.setItem(KEY_STORE, k); }
    function clearKey() { localStorage.removeItem(KEY_STORE); }

    function showLogin() {
        $('#login-box').style.display = 'block';
        $('#list-wrap').style.display = 'none';
    }

    function showList() {
        $('#login-box').style.display = 'none';
        $('#list-wrap').style.display = 'block';
        loadList();
        loadOverview();
    }

    async function tryLogin() {
        const key = $('#admin-key').value;
        if (!key) { toast('请输入管理密码', 'error'); return; }
        const btn = $('#login-btn');
        btn.disabled = true;
        btn.textContent = '验证中…';
        try {
            await api({ key, op: 'list' });
            setKey(key);
            showList();
        } catch (e) {
            toast(e.message, 'error');
        }
        btn.disabled = false;
        btn.textContent = '解锁反馈箱 💕';
    }

    $('#login-btn').addEventListener('click', tryLogin);
    $('#admin-key').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
    $('#refresh-btn').addEventListener('click', loadList);
    $('#logout-btn').addEventListener('click', () => { clearKey(); showLogin(); toast('已退出管理'); });

    // 返回顶部
    const backTop = document.getElementById('back-top');
    window.addEventListener('scroll', () => {
        backTop.classList.toggle('show', window.scrollY > 400);
    }, { passive: true });
    backTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    // 启动：已记住密码则直接进列表
    renderStoryTagFilter();
    if (getKey()) showList(); else showLogin();
    </script>
</body>
</html>
