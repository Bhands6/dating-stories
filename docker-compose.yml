services:
  yuanfen-stories:
    build: .
    container_name: yuanfen-stories
    ports:
      - "8010:80"          # 左边改成你想用的端口
    volumes:
      - ./data:/app/data   # 数据持久化（故事/评论/点赞/图片都存这里）
      # /uploads/{id}.html 直出（CSP sandbox）由 server.js 内置实现，直接读 data/uploads，
      # 不再需要旧 Apache 时代的只读别名挂载。
    restart: unless-stopped
